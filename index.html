<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Necroporra</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">Necroporra</h1>

    <section id="topVoted" class="my-5">
      <h2 class="mb-3">Most Voted Predictions</h2>
      <div class="swiper-container" id="topVotedCarousel">
        <div class="swiper-wrapper">
          <!-- Slides inserted by script.js -->
        </div>
      </div>
    </section>

    <section id="recentDeaths" class="my-5">
      <h2 class="mb-3">Famous People Who Died Last Month</h2>
      <div class="swiper-container" id="recentDeathsCarousel">
        <div class="swiper-wrapper">
          <!-- Slides inserted by script.js -->
        </div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
